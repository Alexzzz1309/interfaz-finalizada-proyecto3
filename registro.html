<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro interfaz 2</title>
        <meta name="description" content="calculadora obra de construccion">
    <meta name="keywords" content="calculadora de materiales de obra de construccion">
    <meta name="author" content="Jose Alexander Casallas y Juan Esteban Suarez">
    <link rel="stylesheet" href="css/registro.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
        <div class="logo-wrapper">
            <div class="logo-container">
                <img class="logoobra" src="icono_obra.png" alt="logo_obra">
            </div>
            <div class="header-text">
                <span class="tituloheader">CalculadoraObra</span>
                <span class="subtituloheader">MATERIALES PRO</span>
            </div>
        </div>

        <div class="nav-links">
            <a href="#" class="nav">Ayuda</a>
            <a href="#" class="nav">Soporte Tecnico</a>
        </div>
    </header>

    <main>
        <section class="registro">
            <h2>Crear una cuenta</h2>
            <p class="subtexto">Únete gratis y guarda todos tus cálculos de obra.</p>

            <form class="form-registro" action="" method="post">
                <label for="usuario">Usuario</label>
                <input class="inputs" type="text" id="usuario" placeholder="Ingresa tu usuario" required>

                <label for="pass">Contraseña</label>
                <input class="inputs" type="password" id="pass" placeholder="••••••••••••" required>

                <label for="pass2">Confirmar contraseña</label>
                <input class="inputs" type="password" id="pass2" placeholder="••••••••••••" required>

                <input class="btn" type="submit" value="Registrarse">
            </form>

            <p class="texto-login">¿Ya tienes una cuenta? <a href="#" class="link-login">Ya tengo una cuenta</a></p>
        </section>
    </main>

    <footer>
        <small>© 2026 Calculadora de Materiales de Construcción. Todos los derechos reservados.</small>
        <div class="footer-links">
            <a href="#">Términos de Servicio</a>
            <a href="#">Política de Privacidad</a>
        </div>
    </footer>
</body>
</html>
